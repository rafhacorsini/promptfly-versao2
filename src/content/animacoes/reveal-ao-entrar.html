<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll-triggered: cada card entra na hora certa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0b; --fg: #f2efe9; --muted: #8b8780; --accent: #ff4c00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-x: clip; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .label { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .title { font-size: clamp(40px, 8vw, 104px); font-weight: 800; letter-spacing: -.045em; line-height: .95; }

  .intro { min-height: 70vh; display: flex; flex-direction: column; justify-content: flex-end; gap: 20px; padding: 0 6vw 8vh; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; padding: 0 6vw 12vh; }
  .ph { aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; background: #1a1816; }
  .meta { display: flex; gap: 10px; padding-top: 12px; font-size: 15px; font-weight: 600; }
  .meta span { color: var(--accent); }

  .outro { min-height: 60vh; display: grid; place-items: center; color: var(--muted); }

  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; gap: 6vh; } }
</style>
</head>
<body>

<header class="intro">
  <p class="label">Scroll-triggered</p>
  <h1 class="title">Cada card entra<br>na hora certa.</h1>
</header>

<section class="grid">
  <article class="card"><div class="ph"><img src="https://res.cloudinary.com/dwmrunhxa/image/upload/f_auto,q_auto,w_900/v1790119063/ChatGPT_Image_22_de_set._de_2026_20_10_55_scraoo.png" alt=""></div><div class="meta"><span>01</span>Casa de praia</div></article>
  <article class="card"><div class="ph"><img src="https://res.cloudinary.com/dwmrunhxa/image/upload/f_auto,q_auto,w_900/v1790119060/ChatGPT_Image_22_de_set._de_2026_20_12_14_rpt0m1.png" alt=""></div><div class="meta"><span>02</span>Estúdio</div></article>
  <article class="card"><div class="ph"><img src="https://res.cloudinary.com/dwmrunhxa/image/upload/f_auto,q_auto,w_900/v1790119058/ChatGPT_Image_22_de_set._de_2026_20_12_56_b7pw2v.png" alt=""></div><div class="meta"><span>03</span>Arquitetura</div></article>
  <article class="card"><div class="ph"><img src="https://res.cloudinary.com/dwmrunhxa/image/upload/f_auto,q_auto,w_900/v1790119053/ChatGPT_Image_22_de_set._de_2026_20_14_56_vppze1.png" alt=""></div><div class="meta"><span>04</span>Hotel</div></article>
  <article class="card"><div class="ph"><img src="https://res.cloudinary.com/dwmrunhxa/image/upload/f_auto,q_auto,w_900/v1790119051/ChatGPT_Image_22_de_set._de_2026_20_15_43_cgaxnw.png" alt=""></div><div class="meta"><span>05</span>Galeria</div></article>
  <article class="card"><div class="ph"><img src="https://res.cloudinary.com/dwmrunhxa/image/upload/f_auto,q_auto,w_900/v1790119049/ChatGPT_Image_22_de_set._de_2026_20_16_25_aizr8c.png" alt=""></div><div class="meta"><span>06</span>Café</div></article>
</section>

<footer class="outro"><p>Role pra cima: os cards saem do mesmo jeito que entraram.</p></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!reduce) {
    gsap.from(".intro > *", { y: 40, opacity: 0, duration: 1, ease: "power3.out", stagger: 0.1 });

    // Estado inicial fora da tela; o batch agrupa os cards que entram juntos
    // e dispara uma animação só, com stagger entre eles.
    gsap.set(".card", { y: 60, opacity: 0 });
    ScrollTrigger.batch(".card", {
      start: "top 88%",
      onEnter: (els) => gsap.to(els, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out", stagger: 0.08, overwrite: true }),
      onLeaveBack: (els) => gsap.to(els, { y: 60, opacity: 0, duration: 0.5, ease: "power2.in", stagger: 0.04, overwrite: true }),
    });
  }
</script>
</body>
</html>
