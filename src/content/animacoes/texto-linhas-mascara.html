<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texto revelado linha por linha com máscara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0b; --fg: #f2efe9; --muted: #8b8780; --accent: #ff4c00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-x: clip; }
  .label { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  .block { min-height: 90vh; display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 0 6vw; }
  .block.right { align-items: flex-end; text-align: right; }
  .lines { font-size: clamp(40px, 8vw, 112px); font-weight: 800; letter-spacing: -.045em; line-height: .98; }
  .lines em { font-style: normal; color: var(--accent); }

  /* A máscara: cada linha esconde o que passa da borda.
     O padding/margin compensa as letras com perna (g, p, ç) pra não cortar. */
  .l { display: block; overflow: hidden; padding-bottom: .1em; margin-bottom: -.1em; }
  .l > span { display: inline-block; will-change: transform; }
</style>
</head>
<body>

<section class="block">
  <p class="label">01 · Manifesto</p>
  <h2 class="lines">
    <span class="l"><span>Sites que parecem</span></span>
    <span class="l"><span><em>filmados</em>, não</span></span>
    <span class="l"><span>montados.</span></span>
  </h2>
</section>

<section class="block right">
  <p class="label">02 · Ritmo</p>
  <h2 class="lines">
    <span class="l"><span>Cada linha sobe</span></span>
    <span class="l"><span>no seu tempo,</span></span>
    <span class="l"><span>nunca <em>tudo junto</em>.</span></span>
  </h2>
</section>

<section class="block">
  <p class="label">03 · Detalhe</p>
  <h2 class="lines">
    <span class="l"><span>A máscara esconde</span></span>
    <span class="l"><span>o texto até a hora</span></span>
    <span class="l"><span>de <em>aparecer</em>.</span></span>
  </h2>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!reduce) {
    gsap.utils.toArray(".block").forEach((block) => {
      const tl = gsap.timeline({
        scrollTrigger: { trigger: block, start: "top 70%", toggleActions: "play none none reverse" },
      });
      tl.from(block.querySelector(".label"), { opacity: 0, y: 20, duration: 0.6, ease: "power2.out" })
        // Cada linha sai de baixo da máscara (yPercent 115) com uma leve rotação
        // que endireita no caminho. expo.out: rápido no começo, assenta devagar.
        .from(block.querySelectorAll(".l > span"), {
          yPercent: 115, rotate: 4, transformOrigin: "0% 100%",
          duration: 1.1, ease: "expo.out", stagger: 0.09,
        }, "-=0.35");
    });
  }
</script>
</body>
</html>
