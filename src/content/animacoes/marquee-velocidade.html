<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee que acelera com a velocidade do scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0b; --fg: #f2efe9; --muted: #8b8780; --accent: #ff4c00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-x: clip; }
  .label { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .title { font-size: clamp(40px, 8vw, 104px); font-weight: 800; letter-spacing: -.045em; line-height: .95; }

  .intro { min-height: 55vh; display: flex; flex-direction: column; justify-content: flex-end; gap: 20px; padding: 0 6vw 8vh; }

  .mq { padding: 14vh 0 40vh; display: flex; flex-direction: column; gap: 1vh; }
  .row { white-space: nowrap; overflow: hidden; will-change: transform; }
  .inner { display: inline-flex; will-change: transform; }
  /* O texto vem duplicado: quando a primeira metade sai, a segunda está no mesmo lugar. */
  .chunk { font-size: clamp(56px, 11vw, 160px); font-weight: 800; letter-spacing: -.05em; line-height: 1; padding-right: .35em; }
  .chunk em { font-style: normal; color: var(--accent); }
  .row.outline .chunk { color: transparent; -webkit-text-stroke: 1.5px var(--fg); }

  .outro { min-height: 80vh; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>

<header class="intro">
  <p class="label">Scroll velocity</p>
  <h1 class="title">Role rápido.<br>O texto acelera.</h1>
</header>

<section class="mq">
  <div class="row"><div class="inner"><span class="chunk">Cinematográfico <em>✦</em> Motion <em>✦</em> Scroll <em>✦</em></span><span class="chunk">Cinematográfico <em>✦</em> Motion <em>✦</em> Scroll <em>✦</em></span></div></div>
  <div class="row outline"><div class="inner"><span class="chunk">Direção de arte ✦ Ritmo ✦ Respiro ✦</span><span class="chunk">Direção de arte ✦ Ritmo ✦ Respiro ✦</span></div></div>
  <div class="row"><div class="inner"><span class="chunk">GSAP <em>✦</em> ScrollTrigger <em>✦</em> Lenis <em>✦</em></span><span class="chunk">GSAP <em>✦</em> ScrollTrigger <em>✦</em> Lenis <em>✦</em></span></div></div>
</section>

<footer class="outro"><p>Parou de rolar, ele volta à velocidade normal.</p></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!reduce) {
    // Cada fileira roda sozinha em loop; as pares andam no sentido contrário.
    const loops = gsap.utils.toArray(".row .inner").map((el, i) => {
      const reverse = i % 2 === 1;
      return gsap.fromTo(el,
        { xPercent: reverse ? -50 : 0 },
        { xPercent: reverse ? 0 : -50, duration: 22, ease: "none", repeat: -1 });
    });

    const skewTo = gsap.quickTo(".row", "skewX", { duration: 0.5, ease: "power3" });
    const clamp = gsap.utils.clamp(-10, 10);
    let idle;

    // A velocidade do scroll (px/s) vira multiplicador do loop e inclinação.
    // direction inverte o sentido quando você rola pra cima.
    ScrollTrigger.create({
      start: 0,
      end: "max",
      onUpdate: (self) => {
        const velocity = self.getVelocity();
        const boost = gsap.utils.clamp(1, 6, 1 + Math.abs(velocity) / 400);
        loops.forEach((t) => gsap.to(t, { timeScale: boost * self.direction, duration: 0.3, overwrite: true }));
        skewTo(clamp(velocity / -250));

        // Quando a rolagem para, tudo volta ao normal suavemente.
        clearTimeout(idle);
        idle = setTimeout(() => {
          loops.forEach((t) => gsap.to(t, { timeScale: self.direction, duration: 1.2, overwrite: true }));
          skewTo(0);
        }, 150);
      },
    });
  }
</script>
</body>
</html>
