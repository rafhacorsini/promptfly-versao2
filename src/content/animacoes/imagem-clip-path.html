<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imagem que abre com clip-path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0b; --fg: #f2efe9; --muted: #8b8780; --accent: #ff4c00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-x: clip; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .label { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .title { font-size: clamp(40px, 8vw, 104px); font-weight: 800; letter-spacing: -.045em; line-height: .95; }

  .intro { min-height: 55vh; display: flex; flex-direction: column; justify-content: flex-end; gap: 20px; padding: 0 6vw 8vh; }

  .stage { height: 260vh; }
  .pin { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  /* A imagem ocupa a tela toda desde o início: o clip-path só decide quanto dela aparece. */
  .media { position: absolute; inset: 0; clip-path: inset(32% 38% 32% 38% round 20px); will-change: clip-path; }
  .media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,11,11,0) 45%, rgba(11,11,11,.7)); }
  .cap { position: absolute; left: 6vw; bottom: 8vh; z-index: 2; font-size: clamp(36px, 7vw, 96px); font-weight: 800; letter-spacing: -.045em; line-height: .95; opacity: 0; }

  .outro { min-height: 60vh; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>

<header class="intro">
  <p class="label">Clip-path reveal</p>
  <h1 class="title">A janela abre<br>com a rolagem.</h1>
</header>

<section class="stage">
  <div class="pin">
    <div class="media"><img src="https://res.cloudinary.com/dwmrunhxa/image/upload/f_auto,q_auto,w_900/v1790119049/ChatGPT_Image_22_de_set._de_2026_20_16_25_aizr8c.png" alt=""></div>
    <h2 class="cap">Abre devagar.<br>Sem cortar a cena.</h2>
  </div>
</section>

<footer class="outro"><p>clip-path anima na GPU: não mexe no layout.</p></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduce) {
    gsap.set(".media", { clipPath: "inset(0% 0% 0% 0% round 0px)" });
    gsap.set(".cap", { opacity: 1 });
  } else {
    const tl = gsap.timeline({
      scrollTrigger: { trigger: ".stage", start: "top top", end: "bottom bottom", scrub: 0.6 },
    });
    // Os dois valores precisam ter a mesma forma (4 lados + round) pra o GSAP interpolar.
    tl.fromTo(".media",
        { clipPath: "inset(32% 38% 32% 38% round 20px)" },
        { clipPath: "inset(0% 0% 0% 0% round 0px)", ease: "none" })
      // A foto começa ampliada e assenta enquanto a janela abre: dá profundidade.
      .fromTo(".media img", { scale: 1.4 }, { scale: 1, ease: "none" }, 0)
      .fromTo(".cap", { opacity: 0, y: 40 }, { opacity: 1, y: 0, ease: "power2.out", duration: 0.3 }, 0.7);
  }
</script>
</body>
</html>
