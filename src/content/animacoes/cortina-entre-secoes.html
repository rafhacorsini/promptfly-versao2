<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortina: a próxima seção sobe por cima da anterior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0b; --fg: #f2efe9; --muted: #b9b4ab; --accent: #ff4c00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-x: clip; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .panel { position: relative; height: 100vh; }
  .inner { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 0%; will-change: transform, opacity; }
  .panel + .panel .inner { border-radius: 24px 24px 0 0; box-shadow: 0 -30px 60px rgba(0,0,0,.5); }
  .bg { position: absolute; inset: 0; }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,11,11,0) 35%, rgba(11,11,11,.8)); }
  .txt { position: absolute; left: 6vw; bottom: 9vh; z-index: 2; }
  .idx { font-size: 13px; font-weight: 600; letter-spacing: .22em; color: var(--accent); }
  .panel h2 { font-size: clamp(44px, 9vw, 128px); font-weight: 800; letter-spacing: -.05em; line-height: .9; margin: 10px 0 12px; }
  .panel p { color: var(--muted); max-width: 38ch; line-height: 1.55; }

  .outro { min-height: 70vh; display: grid; place-items: center; color: #8b8780; }
</style>
</head>
<body>

<section class="panel"><div class="inner"><div class="bg"><img src="https://res.cloudinary.com/dwmrunhxa/image/upload/f_auto,q_auto,w_900/v1790119060/ChatGPT_Image_22_de_set._de_2026_20_12_14_rpt0m1.png" alt=""></div><div class="txt"><p class="idx">CENA 01</p><h2>Chegada</h2><p>Role: a próxima cena sobe por cima desta, como uma cortina.</p></div></div></section>
<section class="panel"><div class="inner"><div class="bg"><img src="https://res.cloudinary.com/dwmrunhxa/image/upload/f_auto,q_auto,w_900/v1789675845/ChatGPT_Image_17_de_set._de_2026_17_10_20_lrrolk.png" alt=""></div><div class="txt"><p class="idx">CENA 02</p><h2>Profundidade</h2><p>A cena de baixo encolhe e escurece. A de cima chega com os cantos arredondados.</p></div></div></section>
<section class="panel"><div class="inner"><div class="bg"><img src="https://res.cloudinary.com/dwmrunhxa/image/upload/f_auto,q_auto,w_900/v1790119055/ChatGPT_Image_22_de_set._de_2026_20_13_45_ic0oaq.png" alt=""></div><div class="txt"><p class="idx">CENA 03</p><h2>Final</h2><p>A última cena não trava: a página continua normal depois dela.</p></div></div></section>

<footer class="outro"><p>Fim das cenas.</p></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!reduce) {
    const panels = gsap.utils.toArray(".panel");
    panels.forEach((panel, i) => {
      const next = panels[i + 1];
      if (!next) return;
      // pinSpacing: false = a seção trava sem empurrar a próxima,
      // então a próxima rola por cima dela.
      ScrollTrigger.create({ trigger: panel, start: "top top", pin: true, pinSpacing: false });
      gsap.to(panel.querySelector(".inner"), {
        scale: 0.88,
        opacity: 0.3,
        ease: "none",
        scrollTrigger: { trigger: next, start: "top bottom", end: "top top", scrub: true },
      });
    });
  }
</script>
</body>
</html>
